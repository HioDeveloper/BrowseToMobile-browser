name: Extract browser archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP archive found in repository root."
            ls -la
            exit 1
          fi

          echo "Archive found: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SOURCE_DIR="extracted/android-app-b2m-source"
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Expected folder android-app-b2m-source was not found."
            find extracted -maxdepth 2 -type d
            exit 1
          fi

          FILE_COUNT="$(find "$SOURCE_DIR" -type f | wc -l | tr -d ' ')"
          echo "Source files extracted: $FILE_COUNT"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::Archive contains no source files."
            exit 1
          fi

          echo "First 20 extracted files:"
          find "$SOURCE_DIR" -type f | sed -n '1,20p'

          cp -a "$SOURCE_DIR"/. .
          rm -rf extracted
          rm -f "$ZIP_FILE"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import BrowseToMobile browser source"
          git push
